<title>고블린 디펜스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: full-bleed pixel canvas per screen, DOM HUD pinned to corners with safe-area offsets. Single dark look. */
:root{
  --ink:#1b130c; --wood:#5a3a1e; --wood-l:#8a5a2b;
  --parch:#ecd9ab; --parch-d:#c9a96a;
  --gold:#f2c14e; --gold-l:#ffe08a; --blood:#c8423a; --steel:#a9b7c6;
  --night:#0f1a14; --forest:#113122; --sea:#1f5fae; --lock:#6d7280;
  --ui:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --num:"Silkscreen","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--parch);overflow:hidden;font-family:var(--ui);user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block}
[hidden]{display:none!important}
.screen{position:fixed;inset:0}
.pix{image-rendering:pixelated;image-rendering:crisp-edges}
button{font-family:var(--ui);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold-l);outline-offset:2px}

/* pixel frame boxes */
.box{background:var(--parch);color:var(--ink);box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--wood),0 0 0 9px var(--ink),0 6px 0 9px rgba(0,0,0,.35)}
.dark{background:#2a1d12;color:var(--parch);box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--wood-l),0 0 0 9px var(--ink)}
.btn{border:0;padding:10px 18px;font-size:20px;background:var(--gold);color:var(--ink);box-shadow:inset -4px -4px 0 #c08a1e,inset 4px 4px 0 var(--gold-l),0 0 0 3px var(--ink),0 5px 0 3px var(--ink);transition:transform .06s}
.btn:active,.btn.press{transform:translateY(4px);box-shadow:inset -4px -4px 0 #c08a1e,inset 4px 4px 0 var(--gold-l),0 0 0 3px var(--ink),0 1px 0 3px var(--ink)}
.btn.alt{background:var(--parch-d);box-shadow:inset -4px -4px 0 #9c7f45,inset 4px 4px 0 #f1dfb4,0 0 0 3px var(--ink),0 5px 0 3px var(--ink)}
.btn.red{background:#d9584e;color:#fff2e0;box-shadow:inset -4px -4px 0 #962f28,inset 4px 4px 0 #f08a7e,0 0 0 3px var(--ink),0 5px 0 3px var(--ink)}
.btn:disabled{filter:grayscale(1) brightness(.75);cursor:not-allowed}
.icon{width:20px;height:20px;vertical-align:-4px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* corners */
.tl{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:calc(18px + env(safe-area-inset-left,0px))}
.tr{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:calc(18px + env(safe-area-inset-right,0px))}
.bl{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:calc(18px + env(safe-area-inset-left,0px))}
.br{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));right:calc(18px + env(safe-area-inset-right,0px))}

.res{display:flex;gap:14px;padding:8px 14px;font-size:20px;align-items:center}
.res span{display:flex;gap:6px;align-items:center}

/* toast */
#toast{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);padding:12px 22px;font-size:24px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:50;text-align:center;max-width:86vw}
#toast.on{opacity:1}

/* ---------- stage select ---------- */
#stageCv{position:absolute;inset:0;width:100%;height:100%}
#stageTitle{position:absolute;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));padding:6px 16px;font-family:var(--num);font-size:16px;letter-spacing:.08em;white-space:nowrap}
#stagePanel{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));padding:12px 16px;display:flex;gap:16px;align-items:center;width:min(560px,calc(100vw - 52px));box-sizing:border-box}
#stagePanel .info{flex:1;min-width:0}
#stagePanel h2{margin:0 0 4px;font-size:24px;font-weight:400;text-wrap:balance}
#stagePanel h2 b{font-family:var(--num);font-size:16px;font-weight:700;margin-right:8px;color:var(--wood)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:15px;padding:2px 8px;background:#d8bf87;box-shadow:0 0 0 2px var(--ink)}
.chip.ok{background:#7cc35a}
.chip.boss{background:#e48c7d}

/* ---------- upgrade ---------- */
#upCv{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
#upCv.drag{cursor:grabbing}
#upCv.hover{cursor:pointer}
.guide{padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.guide div{display:flex;align-items:center;gap:10px}
.guide img{width:22px;height:28px}
.fight{font-size:26px;padding:14px 26px;display:flex;align-items:center;gap:10px}
.fight small{font-family:var(--num);font-size:13px;opacity:.75}
.mapbtn{width:56px;height:56px;padding:0;display:grid;place-items:center}
.mapbtn img{width:34px;height:28px}
#upPopWrap{position:fixed;inset:0;display:grid;place-items:center;background:rgba(8,6,4,.45);z-index:40}
#upPop{width:min(360px,calc(100vw - 52px));padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
#upPop .head{display:flex;gap:12px;align-items:center}
#upPop .ic{width:56px;height:56px;background:#2a1d12;display:grid;place-items:center;box-shadow:0 0 0 3px var(--ink)}
#upPop .ic img{width:40px;height:40px}
#upPop h3{margin:0;font-size:26px;font-weight:400}
#upPop .lv{font-family:var(--num);font-size:13px;color:var(--wood)}
#upPop p{margin:0;font-size:18px;line-height:1.35}
.pips{display:flex;gap:4px}
.pips i{width:14px;height:10px;background:#bfa673;box-shadow:0 0 0 2px var(--ink)}
.pips i.on{background:var(--gold)}
.eff{display:flex;align-items:center;gap:8px;font-size:18px;padding:6px 10px;background:#dcc591;box-shadow:0 0 0 2px var(--ink)}
.eff .arrow{color:var(--wood)}
.eff .nx{color:#2f7a28}
#upPop .row{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:4px}
#upPop .cost{margin-right:auto;font-size:20px;display:flex;align-items:center;gap:6px}
#upPop .cost.short{color:var(--blood)}
#upPop .note{font-size:15px;color:#7a3a20}

/* ---------- battle ---------- */
#bCv{position:absolute;inset:0;width:100%;height:100%}
#hudTop{position:absolute;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:14px;width:min(560px,calc(100vw - 120px));pointer-events:none}
#timer{position:relative;width:100%;height:22px;background:#2a1d12;box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--wood),0 0 0 9px var(--ink);margin-right:24px}
#timerFill{position:absolute;left:3px;top:3px;bottom:3px;width:0;background:repeating-linear-gradient(90deg,#d9584e 0 10px,#c8423a 10px 20px);box-shadow:inset 0 3px 0 #f08a7e}
#timerHead{position:absolute;top:-7px;width:8px;height:36px;margin-left:-4px;background:var(--parch);box-shadow:0 0 0 2px var(--ink)}
#skull{position:absolute;right:-30px;top:50%;width:44px;height:44px;transform:translateY(-50%)}
#skull.boss{animation:pulse .6s steps(2) infinite}
@keyframes pulse{50%{transform:translateY(-50%) scale(1.18)}}
#stats{display:flex;gap:18px;padding:6px 16px;font-size:20px;clip-path:polygon(0 8%,4% 0,30% 6%,60% 0,96% 5%,100% 0,99% 50%,100% 94%,70% 100%,40% 94%,8% 100%,0 92%,1% 50%);background:var(--parch);color:var(--ink);box-shadow:none;border:0}
#stats span{display:flex;align-items:center;gap:6px;white-space:nowrap}
#stats .num{font-size:15px}
#pauseBtn{width:52px;height:52px;padding:0;display:grid;place-items:center}
#pauseBtn i{display:block;width:8px;height:22px;background:var(--ink);box-shadow:14px 0 0 var(--ink);margin-left:-14px}
#summon{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#sumBtn{position:relative;width:92px;height:92px;padding:0;border:0;background:#3a5fa8;box-shadow:inset -5px -5px 0 #233e74,inset 5px 5px 0 #6c9dff,0 0 0 4px var(--ink),0 7px 0 4px var(--ink);transition:transform .07s}
#sumBtn.press,#sumBtn:active{transform:translateY(5px);box-shadow:inset -5px -5px 0 #233e74,inset 5px 5px 0 #6c9dff,0 0 0 4px var(--ink),0 2px 0 4px var(--ink)}
#sumBtn.poor #sumFace{filter:grayscale(.7) brightness(.8)}
#sumFace,#sumCd{position:absolute;inset:0;width:100%;height:100%}
#sumCost{position:absolute;right:-16px;top:-14px;padding:2px 7px;font-size:15px;display:flex;align-items:center;gap:3px;background:var(--gold);color:var(--ink);box-shadow:0 0 0 3px var(--ink)}
#sumCost.short{background:#e48c7d}
#sumKey{position:absolute;left:50%;transform:translateX(-50%);bottom:-26px;font-family:var(--num);font-size:11px;color:var(--parch);opacity:.8;white-space:nowrap}
#hint{font-size:15px;padding:6px 10px;max-width:40vw;line-height:1.3}
#banner{position:fixed;left:0;right:0;top:38%;text-align:center;font-size:clamp(30px,7vw,60px);color:var(--gold);text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);pointer-events:none;opacity:0;transition:opacity .3s;z-index:30}
#banner.on{opacity:1}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(8,6,4,.6);z-index:45}
.panel{padding:22px 24px;display:flex;flex-direction:column;gap:14px;align-items:stretch;width:min(320px,calc(100vw - 52px));box-sizing:border-box;text-align:center}
.panel h2{margin:0 0 4px;font-size:32px;font-weight:400}
.panel .btn{font-size:22px}
.rrow{display:flex;justify-content:space-between;align-items:center;font-size:20px;padding:4px 8px;background:#dcc591;box-shadow:0 0 0 2px var(--ink)}
.rrow span{display:flex;align-items:center;gap:6px}
@media (max-width:560px){
  #stats{gap:10px;font-size:16px;padding:5px 10px}
  #stats .icon{width:16px;height:16px}
  #hint{display:none}
  .guide{font-size:14px}
  .fight{font-size:22px;padding:12px 18px}
  #stagePanel{flex-direction:column;align-items:stretch;gap:10px}
}
@media (prefers-reduced-motion:reduce){#skull.boss{animation:none}}
</style>

<div id="stageScr" class="screen">
  <canvas id="stageCv" class="pix"></canvas>
  <div class="tl box res" id="stRes"></div>
  <div id="stageTitle" class="dark">WORLD 1 · 고블린 숲</div>
  <button class="tr btn alt" id="toUp">강화</button>
  <div id="stagePanel" class="box">
    <div class="info">
      <h2 id="spName"></h2>
      <div class="chips" id="spChips"></div>
    </div>
    <button class="btn" id="goBtn">출격</button>
  </div>
</div>

<div id="upScr" class="screen" hidden>
  <canvas id="upCv"></canvas>
  <div class="tl box res" id="upRes"></div>
  <button class="tr btn alt mapbtn" id="toMap" aria-label="지도"><img class="pix" id="mapIc" alt=""></button>
  <div class="bl dark guide">
    <div><img class="pix" id="mL" alt=""><span>좌클릭 · 드래그 / 선택</span></div>
    <div><img class="pix" id="mW" alt=""><span>휠 · 확대 / 축소</span></div>
  </div>
  <button class="br btn fight" id="fightBtn">전투 <small id="fightLbl">1-1</small></button>
  <div id="upPopWrap" hidden>
    <div id="upPop" class="box" role="dialog" aria-modal="true">
      <div class="head"><div class="ic"><img class="pix" id="ppIc" alt=""></div>
        <div><h3 id="ppName"></h3><div class="lv" id="ppLv"></div></div></div>
      <div class="pips" id="ppPips"></div>
      <p id="ppDesc"></p>
      <div class="eff" id="ppEff"></div>
      <div class="note" id="ppNote" hidden></div>
      <div class="row"><div class="cost" id="ppCost"></div>
        <button class="btn alt" id="ppClose">닫기</button><button class="btn" id="ppBuy">강화</button></div>
    </div>
  </div>
</div>

<div id="battleScr" class="screen" hidden>
  <canvas id="bCv"></canvas>
  <div id="hudTop">
    <div id="timer"><div id="timerFill"></div><div id="timerHead"></div><img id="skull" class="pix" alt="보스"></div>
    <div id="stats">
      <span title="골드"><img class="icon pix" data-ic="coin" alt=""><b class="num" id="hGold">0</b></span>
      <span title="성 체력"><img class="icon pix" data-ic="heart" alt=""><b class="num" id="hHp">0</b></span>
      <span title="인구수"><img class="icon pix" data-ic="helm" alt=""><b class="num" id="hPop">0</b></span>
      <span title="킬"><img class="icon pix" data-ic="sword" alt=""><b class="num" id="hKill">0</b></span>
    </div>
  </div>
  <button class="tr btn alt" id="pauseBtn" aria-label="일시정지"><i></i></button>
  <div class="bl dark" id="hint">땅 클릭: 기사 이동<br>성 클릭: 자동 전투</div>
  <div id="summon">
    <button id="sumBtn" aria-label="기사 소환"><canvas id="sumFace" class="pix"></canvas><canvas id="sumCd"></canvas>
      <span id="sumCost"><img class="icon pix" data-ic="coin" alt="" style="width:14px;height:14px"><b class="num" id="sumCostN">20</b></span></button>
    <div id="sumKey">SPACE</div>
  </div>
  <div id="pauseOv" class="overlay" hidden>
    <div class="panel box">
      <h2>일시정지</h2>
      <button class="btn" id="pResume">계속하기</button>
      <button class="btn alt" id="pRestart">다시하기</button>
      <button class="btn red" id="pQuit">그만하기</button>
    </div>
  </div>
  <div id="resOv" class="overlay" hidden>
    <div class="panel box">
      <h2 id="rTitle"></h2>
      <div class="rrow"><span><img class="icon pix" data-ic="sword" alt="">처치</span><b class="num" id="rKill"></b></div>
      <div class="rrow"><span><img class="icon pix" data-ic="star" alt="">XP</span><b class="num" id="rXp"></b></div>
      <div class="rrow" id="rCrownRow"><span><img class="icon pix" data-ic="crown" alt="">왕관</span><b class="num">+1</b></div>
      <button class="btn" id="rGo">강화하러 가기</button>
    </div>
  </div>
</div>
<div id="banner"></div>
<div id="toast" class="box"></div>

function spriteCanvas(rows,scale=1,tint=null){
  const w=Math.max(...rows.map(r=>r.length)),h=rows.length;
  const c=document.createElement('canvas');c.width=w*scale;c.height=h*scale;
  const x=c.getContext('2d');
  rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const ch=r[i];if(ch==='.'||!PAL[ch])continue;x.fillStyle=tint||PAL[ch];x.fillRect(i*scale,j*scale,scale,scale)}});
  return c;
}

const Up=(()=>{
  const cv=$('upCv'),ctx=cv.getContext('2d');

      ctx.strokeStyle=lv(n.id)>0?'#f2c14e':open?'#a8703c':'#4a4038';ctx.lineWidth=5*cam.z;if(!open)ctx.setLineDash([8*cam.z,8*cam.z]);
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);});
    // root
    const r=toS(0,0),rs=46*cam.z;
    ctx.fillStyle='#0b0805';ctx.fillRect(r.x-rs-4*cam.z,r.y-rs-4*cam.z,rs*2+8*cam.z,rs*2+8*cam.z);
    ctx.fillStyle='#7b4fc0';ctx.fillRect(r.x-rs,r.y-rs,rs*2,rs*2);ctx.fillStyle='#b18cf0';ctx.fillRect(r.x-rs,r.y-rs,rs*2,5*cam.z);ctx.fillRect(r.x-rs,r.y-rs,5*cam.z,rs*2);

      const isH=hover===n;

    $('ppIc').src=iconURL(n.icon);$('ppName').textContent=n.name;$('ppLv').textContent=`LV ${l}/${n.max}`;
    $('ppPips').innerHTML=Array.from({length:n.max},(_,i)=>`<i class="${i<l?'on':''}"></i>`).join('');
    $('ppDesc').textContent=n.desc;
    $('ppEff').innerHTML=done?`<span>${n.eff(l)}</span><span class="arrow">· 최대</span>`:`<span>${n.eff(l)}</span><span class="arrow">→</span><span class="nx">${n.eff(l+1)}</span>`;
    const note=$('ppNote');note.hidden=open;if(!open)note.textContent=`'${n.p==='root'?'':NODE[n.p].name}' 강화를 먼저 완료하세요`;
    $('ppCost').className='cost'+(afford||done?'':' short');
    $('ppCost').innerHTML=done?'<span>강화 완료</span>':`<img class="icon pix" src="${iconURL(n.crown?'crown':'star')}" alt=""><b class="num">${c}</b><span style="font-size:15px;opacity:.7">/ ${have}</span>`;
    $('ppBuy').disabled=!open||done||!afford;$('ppBuy').textContent=n.crown?'해금':'강화';
  }
  $('ppBuy').onclick=()=>{const n=popNode,c=costOf(n),cur=n.crown?'crowns':'xp';if(!isOpen(n)||lv(n.id)>=n.max||save[cur]<c)return;
    save[cur]-=c;save.up[n.id]=lv(n.id)+1;persist();fillPop();$('upRes').innerHTML=resHTML();draw();
    if(n.id.startsWith('wall'))toast(`성 레벨 ${stats().castleLv}!`)};
  $('ppClose').onclick=()=>{$('upPopWrap').hidden=true};
  $('upPopWrap').addEventListener('pointerdown',e=>{if(e.target.id==='upPopWrap')$('upPopWrap').hidden=true});
  $('toMap').onclick=()=>show('stage');
  $('fightBtn').onclick=()=>Battle.start(Math.min(save.stage||1,save.unlocked));
  addEventListener('keydown',e=>{if(current!=='upgrade')return;if(e.key==='Escape')$('upPopWrap').hidden=true});
  addEventListener('resize',()=>{if(current==='upgrade')resize()});
  return{enter(){$('upRes').innerHTML=resHTML();$('fightLbl').textContent='1-'+Math.min(save.stage||1,save.unlocked);$('upPopWrap').hidden=true;cam.z=Math.min(1,Math.min(innerWidth,innerHeight)/1000+.35);resize();
    if(document.fonts)document.fonts.ready.then(draw)}};
})();

/* ================= BATTLE ================= */
const Battle=(()=>{
  const cv=$('bCv'),ctx=cv.getContext('2d');
  const MW=1415,MH=1111,CX=690,CY=585,RX=640,RY=495;
  const GATE={x:690,y:650};
  let W=0,H=0,dpr=1,vs=1,ox=0,oy=0;
  let B=null,raf=0,last=0;
  function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
    vs=Math.min(W/1120,H/920);ox=W/2-707*vs;oy=H/2-560*vs+(H<700?10:20)}
  function start(stageNo){
    const st=STAGES[stageNo-1],S=stats();
    B={no:stageNo,st,S,t:0,gold:S.startGold,hp:S.castleHP,maxHp:S.castleHP,kills:0,units:[],fx:[],texts:[],arrows:[],
      spawnT:2,cd:0,boss:null,bossOut:false,over:false,paused:false,rally:null,shake:0,castleFlash:0,archT:0,slow:1,warn:[]};
    show('battle');resize();
    $('pauseOv').hidden=true;$('resOv').hidden=true;$('skull').classList.remove('boss');
    $('sumCostN').textContent=S.cost;drawFace();
    banner(`1-${stageNo} ${st.name}`,1600);
    cancelAnimationFrame(raf);last=0;raf=requestAnimationFrame(loop);
  }
  // ---------- entities
  function mkKnight(){const S=B.S;return{type:'k',x:GATE.x+(Math.random()-.5)*30,y:GATE.y+Math.random()*10,hp:S.kHP,max:S.kHP,atk:S.kAtk,spd:S.kSpd*3,range:30,rate:.9,at:.3,face:1,flash:0,lunge:0,walk:Math.random()*9,idx:B.units.filter(u=>u.type==='k').length}}
  function mkEnemy(king){
    const st=B.st,ga=st.gates,ang=(Math.floor(Math.random()*ga)*(360/ga)-90+(Math.random()-.5)*20)*Math.PI/180;
    const x=CX+Math.cos(ang)*RX,y=CY+Math.sin(ang)*RY;const dx=CX-x,dy=CY-y,d=Math.hypot(dx,dy);
    const base=king?{hp:150,atk:30,spd:7,range:36,rate:1.4}:{hp:20,atk:4,spd:10,range:28,rate:1};
    B.warn.push({x,y,t:1.2});
    return{type:king?'K':'g',x,y,sx:x,sy:y,ux:dx/d,uy:dy/d,hp:base.hp*st.mult,max:base.hp*st.mult,atk:base.atk*st.mult,spd:base.spd*3,range:base.range,rate:base.rate,at:0,face:dx>0?1:-1,flash:0,lunge:0,walk:Math.random()*9};
  }
  const pop=()=>B.units.filter(u=>u.type==='k'&&u.hp>0).length;
  function summon(){
    if(!B||B.over||B.paused)return;
    const b=$('sumBtn');b.classList.add('press');setTimeout(()=>b.classList.remove('press'),110);
    if(pop()>=B.S.maxPop)return toast('최대 인구수 이상으로 소환할 수 없습니다');
    if(B.cd>0)return toast('아직 소환할 수 없습니다');
    if(B.gold<B.S.cost)return toast('골드가 부족합니다');
    B.gold-=B.S.cost;B.cd=B.S.cd;const k=mkKnight();B.units.push(k);puff(k.x,k.y-10,'#6c9dff',10);
  }
  $('sumBtn').onclick=summon;
  addEventListener('keydown',e=>{if(current!=='battle'||!B)return;
    if(e.code==='Space'){e.preventDefault();summon()}
    if(e.key==='Escape'&&!B.over)setPause(!B.paused)});
  function setPause(p){B.paused=p;$('pauseOv').hidden=!p;if(p)$('pResume').focus()}
  $('pauseBtn').onclick=()=>{if(B&&!B.over)setPause(true)};
  $('pResume').onclick=()=>setPause(false);
  $('pRestart').onclick=()=>start(B.no);
  $('pQuit').onclick=()=>{setPause(false);finish(false,true)};
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&current==='battle'&&B&&!B.over)setPause(true)});
  cv.addEventListener('pointerdown',e=>{if(!B||B.over||B.paused)return;
    const wx=(e.clientX-ox)/vs,wy=(e.clientY-oy)/vs;
    if(((wx-CX)/120)**2+((wy-CY+10)/95)**2<1){B.rally=null;toast('자동 전투: 가장 가까운 적을 공격',1000)}
    else{B.rally={x:Math.max(80,Math.min(MW-80,wx)),y:Math.max(80,Math.min(MH-60,wy)),t:0}}});
  // ---------- fx
  function puff(x,y,c,n=8){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*90;B.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,t:.5+Math.random()*.3,c,sz:4+Math.random()*4})}}
  function dmgText(x,y,v,c){B.texts.push({x:x+(Math.random()-.5)*10,y,txt:String(Math.round(v)),t:.8,c})}
  function hurt(u,v){u.hp-=v;u.flash=.1;dmgText(u.x,u.y-(u.type==='K'?70:44),v,u.type==='k'?'#ff7a5c':'#fff4c2');B.fx.push({x:u.x,y:u.y-18,vx:0,vy:0,t:.12,c:'#fff',sz:10})}
  function kill(u){puff(u.x,u.y-14,u.type==='k'?'#a9b7c6':'#8fd35a',u.type==='K'?22:10);
    if(u.type!=='k'){B.kills++;const g=(u.type==='K'?20:3)*(B.S.loot?2:1);B.gold+=g;dmgText(u.x,u.y-60,'+'+g,'#f2c14e');B.texts[B.texts.length-1].txt='+'+g+'G'}
    if(u.type==='K'){B.slow=.25;setTimeout(()=>finish(true),900)}}
  // ---------- update
  function update(dt){
    const S=B.S,st=B.st;B.t+=dt;
    B.gold+=S.income*dt;B.cd=Math.max(0,B.cd-dt);
    if(S.regen&&B.hp>0)B.hp=Math.min(B.maxHp,B.hp+S.regen*dt);
    // spawns
    B.spawnT-=dt;
    if(B.spawnT<=0){const q=Math.min(1,B.t/st.dur);let iv=st.i0+(st.i1-st.i0)*q;if(B.bossOut)iv*=1.6;B.spawnT=iv;
      const n=1+(Math.random()<st.pair?1:0);for(let i=0;i<n;i++)B.units.push(mkEnemy(false))}
    if(!B.bossOut&&B.t>=st.dur){B.bossOut=true;const k=mkEnemy(true);B.boss=k;B.units.push(k);banner('고블린 왕 등장!',1800);$('skull').classList.add('boss')}
    const knights=B.units.filter(u=>u.type==='k'&&u.hp>0),enemies=B.units.filter(u=>u.type!=='k'&&u.hp>0);
    // knights
    knights.forEach((k,i)=>{
      k.at-=dt;k.flash-=dt;k.lunge=Math.max(0,k.lunge-dt);
      if(S.bless)k.hp=Math.min(k.max,k.hp+2*dt);
      let tgt=null,best=1e9;
      const ref=B.rally||k, rad=B.rally?170:1e9;
      enemies.forEach(e=>{const dr=Math.hypot(e.x-ref.x,e.y-ref.y);if(dr>rad)return;const d=Math.hypot(e.x-k.x,e.y-k.y);if(d<best){best=d;tgt=e}});
      let mx=0,my=0;
      if(tgt){const dx=tgt.x-k.x,dy=tgt.y-k.y,d=Math.hypot(dx,dy);k.face=dx>=0?1:-1;
        if(d>k.range){mx=dx/d;my=dy/d}
        else if(k.at<=0){k.at=k.rate;k.lunge=.12;k.lx=dx/d;k.ly=dy/d;hurt(tgt,k.atk);
          if(S.cleave)enemies.forEach(e=>{if(e!==tgt&&e.hp>0&&Math.hypot(e.x-k.x,e.y-k.y)<56)hurt(e,k.atk*.5)});
          enemies.forEach(e=>{if(e.hp<=0&&!e.dead){e.dead=true;kill(e)}})}}
      else{const home=B.rally||{x:GATE.x,y:GATE.y+40};const ang=k.idx*2.4,rr=B.rally?18+8*Math.sqrt(k.idx):60+10*Math.sqrt(k.idx);
        const hx=home.x+Math.cos(ang)*rr,hy=home.y+Math.sin(ang)*rr*.6;const dx=hx-k.x,dy=hy-k.y,d=Math.hypot(dx,dy);if(d>4){mx=dx/d;my=dy/d;k.face=dx>=0?1:-1}}
      // separation
      knights.forEach(o=>{if(o===k)return;const dx=k.x-o.x,dy=k.y-o.y,d=Math.hypot(dx,dy);if(d<22&&d>0){mx+=dx/d*.8;my+=dy/d*.8}});
      const m=Math.hypot(mx,my);if(m>0){const sp=k.spd*dt*Math.min(1,m);k.x+=mx/m*sp;k.y+=my/m*sp;k.walk+=dt*10}
      k.x=Math.max(40,Math.min(MW-40,k.x));k.y=Math.max(50,Math.min(MH-30,k.y));
    });
    // enemies: walk the straight line to the castle; fight only knights sitting on that line ahead of them
    enemies.forEach(e=>{
      e.at-=dt;e.flash-=dt;e.lunge=Math.max(0,e.lunge-dt);
      let foe=null,bf=1e9;const lane=e.type==='K'?34:28,ahead=e.range+18;
      knights.forEach(k=>{if(k.hp<=0)return;const rx=k.x-e.x,ry=k.y-e.y,fw=rx*e.ux+ry*e.uy,pp=Math.abs(rx*e.uy-ry*e.ux);
        if(fw>-16&&fw<ahead&&pp<lane&&fw<bf){bf=fw;foe=k}});
      const atCastle=((e.x-CX)/115)**2+((e.y-CY)/85)**2<1;
      if(foe){const d=Math.hypot(foe.x-e.x,foe.y-e.y);
        if(d>e.range){e.x+=e.ux*e.spd*dt;e.y+=e.uy*e.spd*dt;e.walk+=dt*8}
        else if(e.at<=0){e.at=e.rate;e.lunge=.14;e.lx=e.ux;e.ly=e.uy;hurt(foe,e.atk);if(foe.hp<=0&&!foe.dead){foe.dead=true;kill(foe)}}}
      else if(atCastle){if(e.at<=0){e.at=e.rate;e.lunge=.14;e.lx=e.ux;e.ly=e.uy;B.hp-=e.atk;B.shake=.25;B.castleFlash=.12;dmgText(e.x+e.ux*40,e.y+e.uy*40-30,e.atk,'#ff7a5c')}}
      else{e.x+=e.ux*e.spd*dt;e.y+=e.uy*e.spd*dt;e.walk+=dt*8}
    });
    // archers
    if(S.archer){B.archT-=dt;if(B.archT<=0){let t=null,b=270;enemies.forEach(e=>{const d=Math.hypot(e.x-CX,e.y-CY);if(d<b){b=d;t=e}});
      if(t){B.archT=1.2;B.arrows.push({x:CX,y:CY-110,t,sp:520})}}}
    B.arrows.forEach(a=>{const dx=a.t.x-a.x,dy=a.t.y-20-a.y,d=Math.hypot(dx,dy);a.ang=Math.atan2(dy,dx);if(d<a.sp*dt||a.t.hp<=0){a.done=true;if(a.t.hp>0){hurt(a.t,S.arrowDmg);if(a.t.hp<=0&&!a.t.dead){a.t.dead=true;kill(a.t)}}}else{a.x+=dx/d*a.sp*dt;a.y+=dy/d*a.sp*dt}});
    B.arrows=B.arrows.filter(a=>!a.done);
    B.units=B.units.filter(u=>u.hp>0);
    B.fx.forEach(f=>{f.t-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=260*dt});B.fx=B.fx.filter(f=>f.t>0);
    B.texts.forEach(f=>{f.t-=dt;f.y-=40*dt});B.texts=B.texts.filter(f=>f.t>0);
    B.warn.forEach(w=>w.t-=dt);B.warn=B.warn.filter(w=>w.t>0);
    B.shake=Math.max(0,B.shake-dt);B.castleFlash-=dt;if(B.rally)B.rally.t+=dt;
    if(B.hp<=0&&!B.over){B.hp=0;finish(false)}
  }
  // ---------- draw
  function drawUnit(u){
    const isK=u.type==='k',king=u.type==='K',sc=isK?2.6:king?4.2:2.5;
    const img=u.flash>0?(isK?IMGW.knight:IMGW.goblin):(isK?IMG.knight:IMG.goblin);
    const lg=u.lunge>0?Math.sin(u.lunge/.14*Math.PI)*9:0;
    const bob=Math.floor(u.walk)%2*sc;
    const x=u.x+(u.lx||0)*lg,y=u.y+(u.ly||0)*lg;
    // shadow
    ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(x,y,img.width*sc*.32,img.width*sc*.12,0,0,7);ctx.fill();
    ctx.save();ctx.translate(Math.round(x),Math.round(y-img.height*sc+sc-bob));if(u.face<0)ctx.scale(-1,1);
    if(king){ctx.fillStyle='#8f2a24';ctx.fillRect(-img.width*sc/2+sc*2,sc*7,(img.width-4)*sc,sc*6)}
    ctx.drawImage(img,-img.width*sc/2,0,img.width*sc,img.height*sc);
    if(king){const cs=sc*.75;ctx.drawImage(u.flash>0?IMGW.crown:IMG.crown,-9*cs/2,-5*cs+sc,9*cs,5*cs)}
    ctx.restore();
    // hp bar
    if(u.hp<u.max||king){const bw=king?64:30,bh=king?7:5,bx=x-bw/2,by=y-img.height*sc-(king?18:10);
      ctx.fillStyle='#1b130c';ctx.fillRect(bx-2,by-2,bw+4,bh+4);ctx.fillStyle='#4a2a22';ctx.fillRect(bx,by,bw,bh);
      ctx.fillStyle=isK?'#6c9dff':king?'#f2c14e':'#ff5a3c';ctx.fillRect(bx,by,bw*Math.max(0,u.hp/u.max),bh)}
  }
  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;
    ctx.fillStyle='#113122';ctx.fillRect(0,0,W,H);
    const sh=B.shake>0?(Math.random()-.5)*8*B.shake*4:0;
    ctx.save();ctx.translate(ox+sh,oy);ctx.scale(vs,vs);
    ctx.imageSmoothingEnabled=true;if(mapImg.complete)ctx.drawImage(mapImg,0,0,MW,MH);ctx.imageSmoothingEnabled=false;
    // spawn warnings
    B.warn.forEach(w=>{const a=Math.min(1,w.t)*(.5+.5*Math.sin(w.t*18));ctx.fillStyle=`rgba(255,70,50,${.35*a})`;ctx.beginPath();ctx.arc(w.x,w.y,34,0,7);ctx.fill()});
    // rally flag
    if(B.rally){const r=B.rally;ctx.strokeStyle='rgba(108,157,255,.7)';ctx.lineWidth=3;ctx.setLineDash([8,6]);ctx.beginPath();ctx.ellipse(r.x,r.y,170,110,0,0,7);ctx.stroke();ctx.setLineDash([]);
      const s=4;ctx.drawImage(IMG.flag,r.x-2,r.y-8*s+Math.round(Math.sin(r.t*4)),8*s,8*s)}
    // castle + units sorted by y
    const ci=castleImgs[B.S.castleLv-1];
    const items=B.units.slice();items.push({castle:true,y:CY+60});items.sort((a,b)=>a.y-b.y);
    items.forEach(u=>{if(u.castle){if(ci.complete){ctx.imageSmoothingEnabled=false;const w=ci.naturalWidth*2.2,h=ci.naturalHeight*2.2;
        ctx.drawImage(ci,CX-w/2,CY+65-h,w,h);
      }}else drawUnit(u)});
    if(B.castleFlash>0){ctx.fillStyle='rgba(255,60,40,.25)';ctx.beginPath();ctx.ellipse(CX,CY-20,130,110,0,0,7);ctx.fill()}
    // arrows
    B.arrows.forEach(a=>{ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.ang);ctx.fillStyle='#1b130c';ctx.fillRect(-14,-2,24,4);ctx.fillStyle='#e9d3a0';ctx.fillRect(-12,-1,20,2);ctx.fillStyle='#ff9a3c';ctx.fillRect(8,-2,5,4);ctx.restore()});
    B.fx.forEach(f=>{ctx.globalAlpha=Math.min(1,f.t*2);ctx.fillStyle=f.c;ctx.fillRect(f.x-f.sz/2,f.y-f.sz/2,f.sz,f.sz)});ctx.globalAlpha=1;
    ctx.font='bold 22px Silkscreen, monospace';ctx.textAlign='center';
    B.texts.forEach(f=>{ctx.globalAlpha=Math.min(1,f.t*2);ctx.fillStyle='#1b130c';ctx.fillText(f.txt,f.x+2,f.y+2);ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x,f.y)});ctx.globalAlpha=1;
    ctx.restore();
  }
  // ---------- HUD
  function drawFace(){const c=$('sumFace');c.width=92;c.height=92;const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(IMG.knight,0,0,16,13,-4,4,16*6,13*6)}
  function hud(){
    const q=Math.min(1,B.t/B.st.dur);$('timerFill').style.width=`calc(${q*100}% - ${q*6}px)`;$('timerHead').style.left=`calc(${q*100}%)`;
    $('hGold').textContent=Math.floor(B.gold);$('hHp').textContent=`${Math.ceil(B.hp)}/${B.maxHp}`;$('hPop').textContent=`${pop()}/${B.S.maxPop}`;$('hKill').textContent=B.kills;
    const short=B.gold<B.S.cost;$('sumCost').classList.toggle('short',short);$('sumBtn').classList.toggle('poor',short||pop()>=B.S.maxPop);
    const c=$('sumCd'),w=92;if(c.width!==w){c.width=w;c.height=w}const x=c.getContext('2d');x.clearRect(0,0,w,w);
    if(B.cd>0){const el=1-B.cd/B.S.cd;x.fillStyle='rgba(10,8,20,.62)';x.beginPath();x.moveTo(w/2,w/2);x.arc(w/2,w/2,w,-Math.PI/2+el*Math.PI*2,Math.PI*1.5);x.closePath();x.fill();
      x.fillStyle='#fff4c2';x.font='bold 20px Silkscreen, monospace';x.textAlign='center';x.textBaseline='middle';x.fillText(B.cd.toFixed(1),w/2,w/2+18)}
  }
  function loop(now){
    const dt=Math.min(.05,(now-(last||now))/1000)*B.slow;last=now;
    if(!B.paused&&!B.over)update(dt);
    if(B.over&&B.slow<1)update(dt*.5);
    draw();hud();
    if(current==='battle')raf=requestAnimationFrame(loop);
  }
  let bannerT=0;
  function banner(t,ms){const b=$('banner');b.textContent=t;b.classList.add('on');clearTimeout(bannerT);bannerT=setTimeout(()=>b.classList.remove('on'),ms)}
  function finish(win,quit){
    if(!B||B.over)return;B.over=true;
    const xp=B.kills;save.xp+=xp;
    if(win){save.crowns+=1;save.cleared[B.no]=true;save.unlocked=Math.max(save.unlocked,Math.min(6,B.no+1));save.stage=Math.min(6,B.no+1)}else save.stage=B.no;
    persist();
    $('rTitle').textContent=win?'스테이지 클리어!':quit?'후퇴했습니다':'성이 함락되었습니다';
    $('rKill').textContent=B.kills;$('rXp').textContent='+'+xp;$('rCrownRow').hidden=!win;
    setTimeout(()=>{$('resOv').hidden=false;$('rGo').focus()},win?200:500);
  }
  $('rGo').onclick=()=>{$('resOv').hidden=true;show('upgrade')};
  addEventListener('resize',()=>{if(current==='battle')resize()});
  return{start};
})();

show('stage');
</script>
